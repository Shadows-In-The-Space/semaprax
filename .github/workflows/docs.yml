name: Docs

# A push to `main` or an explicit manual dispatch only. The book is published
# from `main`; building it on every other branch and pull request gated nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per commit on `main`, one group per ref everywhere else.
  #
  # Superseding a run is right for a manually dispatched branch run, where only
  # the tip matters. It is wrong for `main`: a cancelled run here means that commit's
  # site is never published, and a cancellation is neither a pass nor a
  # failure, so nothing turns red. Every push to `main` must be allowed to
  # finish and publish (see the identical `ci.yml` fix for issue #169).
  #
  # `cancel-in-progress: false` alone does not achieve that: GitHub keeps at
  # most one *pending* run per concurrency group, so a third arrival cancels the
  # queued one while the executing run is protected. This workflow is fast
  # enough that it usually finishes before the next push, which is why it has
  # been mostly green while `ci.yml` was mostly cancelled — the same latent bug,
  # hidden by duration. Put the commit in the group so it cannot bite here
  # either.
  group: docs-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'ref-tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: Build book
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore the pinned mdBook executable
        id: mdbook-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mdbook
          key: mdbook-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MDBOOK_VERSION }}
      - name: Install pinned mdBook
        if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install --locked mdbook --version "$MDBOOK_VERSION" --root "$RUNNER_TEMP/mdbook"
      - name: Select and verify pinned mdBook
        run: |
          echo "$RUNNER_TEMP/mdbook/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/mdbook/bin/mdbook" --version)" = "mdbook v$MDBOOK_VERSION"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the documentation book
        run: mdbook build
      - name: Upload the built book
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/docs-book

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
